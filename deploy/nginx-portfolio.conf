# Install to /etc/nginx/sites-available/portfolio, then:
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Frontend and API share one origin (youssifallam.com) — the React app uses a
# hash router, so the browser only ever requests "/" from the server; every
# other path below (/api/, /site_administration/, /media/, /static/) is
# claimed explicitly before the catch-all SPA location.
#
# Bare-IP-compatible HTTP for now. TLS block is at the bottom (commented) —
# enable it after DNS for youssifallam.com points at this server and
# `certbot --nginx` has run.

upstream portfolio_backend {
    server 127.0.0.1:8002;
}

server {
    listen 80;
    listen [::]:80;
    server_name youssifallam.com www.youssifallam.com;

    client_max_body_size 20M;

    # Django-collected static files (admin, DRF browsable API, Unfold theme).
    location /static/ {
        alias /srv/portfolio/app/Backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Uploaded + auto-compressed project images (see apps/portfolio/utils/images.py).
    location /media/ {
        alias /srv/portfolio/data/media/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # http now; https after TLS
        proxy_read_timeout 60s;
    }

    location /site_administration/ {
        proxy_pass http://portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ckeditor5/ {
        proxy_pass http://portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built frontend (Vite `dist/`). Long-lived caching for the hashed asset
    # filenames; index.html itself is not cached so a redeploy is picked up
    # immediately.
    root /srv/portfolio/app/frontend/dist;

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ── After DNS + TLS (certbot) ─────────────────────────────────────────────────
# certbot --nginx -d youssifallam.com -d www.youssifallam.com will rewrite this
# automatically. The result should:
#   - listen 443 ssl; with the certificate paths,
#   - redirect port 80 → 443,
#   - keep X-Forwarded-Proto $scheme (now "https").
# Then set SECURE_SSL_REDIRECT/SESSION_COOKIE_SECURE/CSRF_COOKIE_SECURE=true,
# SECURE_HSTS_SECONDS=31536000, and https:// in the CORS/CSRF origin lists in
# Backend/ENV/.env.Production, and restart portfolio-backend.
