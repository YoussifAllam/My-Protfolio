name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:   # manual "Run workflow" button, e.g. to redeploy without a new commit

# A newer push on the same branch cancels any in-flight run for it — no point
# finishing a check run that's already superseded.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend — lint + system check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: flake8
        run: python -m flake8 .

      - name: Set up local env file
        # ENVIRONMENT is unset -> config/env.py defaults to "local" -> SQLite,
        # so this needs no secrets and no external services. The placeholder
        # SECRET_KEY in .env.example is fine for `check`/`makemigrations`,
        # which don't validate its strength (only `check --deploy` does).
        run: cp ENV/.env.example ENV/.env.local

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  frontend-checks:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.3"   # matches front/.mise.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # matches front/.mise.toml
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (production mode — picks up committed .env.production)
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front/dist
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production   # never run two deploys at once
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: front/dist

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (public info, not a secret) — avoids both a stored
          # extra secret and StrictHostKeyChecking=no's MITM exposure.
          cat >> ~/.ssh/known_hosts <<'EOF'
          64.227.16.189 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID3gOGSIPZjHIN21Y6dPvBNq/d3z7nHtXJcXRKdlG5HJ
          EOF

      - name: Sync backend code
        run: |
          rsync -az --delete \
            --exclude 'Venv/' --exclude 'venv/' --exclude 'ENV/' \
            --exclude 'staticfiles/' --exclude 'media/' --exclude 'LOGS/' \
            --exclude 'db.sqlite3' --exclude '__pycache__/' --exclude '*.pyc' \
            --exclude '.git/' --exclude '.vscode/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            Backend/ portfolio@64.227.16.189:/srv/portfolio/app/Backend/
        # --delete makes this a mirror of the checked-out tree (minus the
        # excludes above), so a file removed from the repo is removed on the
        # server too — but data/env/venv are excluded, so it can never touch
        # the database, uploaded media, or installed packages.

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            front/dist/ portfolio@64.227.16.189:/srv/portfolio/app/frontend/dist/

      - name: Migrate + collectstatic
        run: |
          ssh -i ~/.ssh/deploy_key portfolio@64.227.16.189 '
            set -e
            cd /srv/portfolio/app/Backend
            export ENVIRONMENT=Production
            export DJANGO_SETTINGS_MODULE=config.django
            /srv/portfolio/venv/bin/python manage.py migrate --noinput
            /srv/portfolio/venv/bin/python manage.py collectstatic --noinput
          '
        # No seed step: seed_portfolio was removed (860d6a2) once all
        # Profile/Project/Experience/Skills/Achievements content moved to
        # being managed directly through the admin — prod data no longer has
        # a file counterpart to sync from on every deploy.
        # Deliberately does NOT run `pip install` here: the deploy key only
        # has narrow sudo (restart/status of one service, see
        # /etc/sudoers.d/portfolio-deploy), and the venv is root-owned by
        # design (same hardening the sibling pos-backend deployment uses) so
        # this user can run it but not modify its installed packages. A
        # requirements.txt change needs one manual
        # `pip install -r requirements.txt` as root — rare enough not to
        # automate at the cost of giving CI root.

      - name: Restart backend service
        run: |
          ssh -i ~/.ssh/deploy_key portfolio@64.227.16.189 \
            'sudo -n systemctl restart portfolio-backend'

      - name: Health check
        run: |
          sleep 3
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://youssifallam.com/api/portfolio/summary/)
            if [ "$code" = "200" ]; then
              echo "Healthy (attempt $i): $code"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying..."
            sleep 3
          done
          echo "Deploy finished but the health check never returned 200 — check the service."
          exit 1
